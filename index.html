
<!DOCTYPE html>
<html lang="de">
<head>
  <link rel="stylesheet" href="style.css">
	<script src="script.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Talking Label</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: white;
      color: black;
      font-family: Arial, sans-serif;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      padding: 25px;
      text-align: center;
    }

    #text {
      font-size: clamp(32px, 8vw, 64px);
      font-weight: bold;
      overflow-wrap: anywhere;
      margin-bottom: 40px;
    }

    #playButton {
      width: 90px;
      height: 90px;
      border: none;
      border-radius: 50%;
      background: #1677e8;
      color: white;
      font-size: 42px;
      cursor: pointer;
    }

    #playButton:active {
      background: #0955a5;
      transform: scale(0.95);
    }
  </style>
</head>

<body>

  <!-- Textanzeige -->
  <div id="text"></div>

  <!-- Vorlese-Button -->
  <button id="playButton" aria-label="Text vorlesen">
    ▶
  </button>

  <script>

    // Text aus der URL auslesen
    const params = new URLSearchParams(
      window.location.search
    );

    const text = params.get("text") || "Kein Text angegeben";

    // Text auf der Webseite anzeigen
    document.getElementById("text").textContent = text;

    // Sprachsynthese
    document.getElementById("playButton").addEventListener("click", () => {

      // Laufende Sprachausgabe stoppen
      speechSynthesis.cancel();

      // Sprachobjekt erstellen
      const speech = new SpeechSynthesisUtterance(text);

      // Deutsche Sprache einstellen
      speech.lang = "de-DE";

      // Vorlesen
      speechSynthesis.speak(speech);

    });

  </script>

</body>
</html>
